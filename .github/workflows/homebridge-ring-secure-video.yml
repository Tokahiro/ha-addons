name: homebridge-ring-secure-video

on:
  push:
    branches: [main]
    paths:
      - "homebridge-ring-secure-video/**"
      - ".github/workflows/homebridge-ring-secure-video.yml"
  pull_request:
    paths:
      - "homebridge-ring-secure-video/**"
      - ".github/workflows/homebridge-ring-secure-video.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homebridge-ring-secure-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Pack
        run: |
          version=$(node -p "require('./package.json').version")
          name="homebridge-ring-secure-video-${version//+/-}"
          mv "$(npm pack --ignore-scripts --silent)" "${name}.tgz"
          echo "NAME=${name}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: homebridge-ring-secure-video/${{ env.NAME }}.tgz

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(ls dist/*.tgz)
          tag=$(basename "$file" .tgz)
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists. Raise the version in package.json for a new one."
            exit 0
          fi
          gh release create "$tag" "$file" --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Homebridge plugin @tokahiro/homebridge-ring-secure-video (homebridge-ring-secure-video, patched). See homebridge-ring-secure-video/FORK.md for install and CHANGELOG.md for the changes."

  npm:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish on npm if the version is new
        env:
          # Only until trusted publishing is set up on npmjs.com (see FORK.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          file=$(ls dist/*.tgz)
          name=$(tar -xOzf "$file" package/package.json | jq -r .name)
          version=$(tar -xOzf "$file" package/package.json | jq -r .version)
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is on npm. Raise the version in package.json for a new one."
            exit 0
          fi
          npm publish "$file" --provenance --access public
